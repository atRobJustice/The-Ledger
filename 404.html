<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      var path = location.pathname || "";
      if (path.indexOf("/progeny") === 0) {
        // Static hosts have no SPA fallback under /progeny/* except / and /create/.
        location.replace("/progeny/" + location.search + location.hash);
        return;
      }
      location.replace("/");
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/">
</head>
<body>
  <p><a href="/">Return to The Ledger</a></p>
</body>
</html>
